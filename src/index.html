<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>nonoPanel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="fonts/mdi/materialdesignicons.min.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/cards.css">
  <link rel="stylesheet" href="styles/clock.css">
  <link rel="stylesheet" href="styles/weather.css">
  <link rel="stylesheet" href="styles/calendar.css">
  <link rel="stylesheet" href="styles/pomodoro.css">
  <link rel="stylesheet" href="styles/settings.css">
  <link rel="stylesheet" href="styles/media.css">
  <link rel="stylesheet" href="styles/pet.css">
</head>
<body>
  <button id="fullscreen-btn" class="fixed-btn" title="全屏">
    <span class="mdi mdi-fullscreen"></span>
  </button>
  <button id="settings-btn" class="fixed-btn" title="设置">
    <span class="mdi mdi-cog"></span>
  </button>

  <div class="page-indicator">
    <div class="indicator-dot active" data-page="0"></div>
    <div class="indicator-dot" data-page="1"></div>
  </div>

  <div class="pages-container">
    <div class="page-content active" id="main-page">
      <div class="main-layout">
        <div class="card clock-card" id="clock-card">
          <div class="clock-inner">
            <div class="time-display">
              <div class="time-hm" id="time-hm">00:00</div>
              <div class="time-s" id="time-s">00</div>
            </div>
            <div class="clock-divider"></div>
            <div class="clock-meta">
              <div class="clock-week" id="clock-week">星期一</div>
              <div class="clock-date" id="clock-date">2026年7月8日</div>
            </div>
            <div id="media-widget" style="visibility:hidden;position:absolute;bottom:0;left:0;right:0;z-index:3;padding:0 28px 20px;display:flex;flex-direction:column;gap:12px">
              <div style="display:flex;align-items:center;gap:16px">
                <div id="media-cover" style="width:72px;height:72px;border-radius:8px;background:rgba(121,191,96,0.12);flex-shrink:0;overflow:hidden">
                  <img id="media-cover-img" src="" style="width:100%;height:100%;object-fit:cover;display:none">
                </div>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px">
                  <div id="media-title" style="font-size:16px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
                  <div id="media-artist" style="font-size:13px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
                </div>
                <div style="display:flex;gap:12px;flex-shrink:0">
                  <button id="media-prev" disabled style="width:40px;height:40px;border-radius:50%;border:1px solid rgba(121,191,96,0.18);background:rgba(121,191,96,0.12);color:var(--clock-accent);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"><span class="mdi mdi-skip-previous" style="font-size:20px"></span></button>
                  <button id="media-play" disabled style="width:40px;height:40px;border-radius:50%;border:1px solid rgba(121,191,96,0.18);background:rgba(121,191,96,0.12);color:var(--clock-accent);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"><span class="mdi mdi-play" style="font-size:20px"></span></button>
                  <button id="media-next" disabled style="width:40px;height:40px;border-radius:50%;border:1px solid rgba(121,191,96,0.18);background:rgba(121,191,96,0.12);color:var(--clock-accent);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"><span class="mdi mdi-skip-next" style="font-size:20px"></span></button>
                </div>
              </div>
              <div id="lyrics-container" style="text-align:center;overflow:hidden;line-height:1.6">
                <div id="lyric-line1" style="font-size:16px;color:var(--text-primary);font-weight:600"></div>
                <div id="lyric-line2" style="font-size:14px;color:var(--text-tertiary)"></div>
              </div>
            </div>

          </div>
        </div>

        <div class="card weather-card" id="weather-card">
          <div class="weather-layout">

            <!-- 左列：当前天气主视觉（取全高） -->
            <div class="weather-col-left">
              <div class="weather-now">
                <div class="city-name" id="city-name">定位中...</div>
                <div class="weather-icon-wrap" id="weather-icon">🌤️</div>
                <div class="weather-temp-block">
                  <div class="temperature" id="temperature">--</div>
                  <div class="temp-unit">°C</div>
                </div>
                <div class="weather-text-block">
                  <div class="weather-desc" id="weather-desc">加载中</div>
                  <div class="weather-range" id="today-range">-- / --°</div>
                </div>
                <div class="weather-update-time" id="source-text">获取中...</div>
              </div>
            </div>

            <!-- 右列：指标条 + 预报面板 -->
            <div class="weather-col-right">
              <div class="detail-strip">
                <div class="detail-chip">
                  <span class="detail-icon mdi mdi-thermometer"></span>
                  <div class="detail-label">体感</div>
                  <div class="detail-value" id="feels-like">--°</div>
                </div>
                <div class="detail-chip">
                  <span class="detail-icon mdi mdi-water-percent"></span>
                  <div class="detail-label">湿度</div>
                  <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="detail-chip">
                  <span class="detail-icon mdi mdi-weather-windy"></span>
                  <div class="detail-label">风速</div>
                  <div class="detail-value" id="wind">--</div>
                </div>
                <div class="detail-chip">
                  <span class="detail-icon mdi mdi-compass-outline"></span>
                  <div class="detail-label">风向</div>
                  <div class="detail-value" id="wind-dir">--</div>
                </div>
                <div class="detail-chip">
                  <span class="detail-icon mdi mdi-gauge"></span>
                  <div class="detail-label">气压</div>
                  <div class="detail-value" id="pressure">--</div>
                </div>
                <div class="detail-chip">
                  <span class="detail-icon mdi mdi-eye-outline"></span>
                  <div class="detail-label">能见度</div>
                  <div class="detail-value" id="vis">--</div>
                </div>
              </div>
              <div class="forecast-panel" id="forecast-panel">
                <div class="forecast-view-toggle">
                  <span class="view-opt active" id="view-hourly">逐时</span>
                  <span class="view-sep">·</span>
                  <span class="view-opt" id="view-daily">7天</span>
                </div>
                <div class="forecast-content">
                  <div class="hourly-row" id="hourly-row"></div>
                  <div class="daily-row" id="daily-row" style="display:none;"></div>
                </div>
              </div>
            </div>

          </div>
          <!-- hidden compat -->
          <span id="status-dot" style="display:none"></span>
          <div style="display:none">
            <span id="dew"></span><span id="today-text"></span>
            <span id="today-wind"></span><span id="today-wind-extra"></span>
          </div>
        </div>

        <div class="card calendar-card">
          <div class="calendar-header">
            <div class="calendar-title">
              <span id="cal-title">加载中...</span>
              <div class="week-pill" id="week-pill">第--周</div>
            </div>
            <div class="calendar-nav">
              <button id="cal-prev" class="cal-nav-btn">‹</button>
              <button id="cal-next" class="cal-nav-btn">›</button>
            </div>
          </div>
          <div class="week-header-row" id="week-header-row"></div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </div>
      </div>
    </div>

    <div class="page-content" id="pomodoro-page">
      <div class="pomodoro-layout">
        <div class="pomo-panel pomo-left">
          <h3 class="panel-title">计时设置</h3>
          <div class="mode-buttons">
            <button class="mode-tag active" data-mode="work">标准番茄</button>
            <button class="mode-tag" data-mode="short">深度工作</button>
            <button class="mode-tag" data-mode="custom">冲刺模式</button>
            <button class="mode-tag" data-mode="custom2">自定义</button>
          </div>
          <div class="task-section">
            <button class="add-task-btn" id="add-task-btn">
              <span class="mdi mdi-plus"></span> 新增任务
            </button>
            <div class="task-list" id="task-list"></div>
          </div>
        </div>

        <div class="pomo-center">
          <div class="timer-circle">
            <svg class="progress-ring" width="360" height="360">
              <circle class="progress-ring-track" stroke="rgba(201,178,130,0.32)" stroke-width="5" fill="transparent" r="160" cx="180" cy="180"></circle>
              <circle class="progress-ring-progress" stroke="url(#pomo-gradient)" stroke-width="5" fill="transparent" r="160" cx="180" cy="180"></circle>
              <defs>
                <linearGradient id="pomo-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" style="stop-color:#efbc47;stop-opacity:1"></stop>
                  <stop offset="100%" style="stop-color:#ec8a9f;stop-opacity:1"></stop>
                </linearGradient>
              </defs>
            </svg>
            <div class="timer-display">
              <div class="timer-time" id="timer-time">25:00</div>
              <div class="timer-label" id="timer-label">专注待开始</div>
              <div class="timer-session" id="timer-session">已完成 0/4 番茄</div>
            </div>
          </div>
          <div class="timer-controls">
            <button class="control-btn play-btn" id="start-btn"><span class="mdi mdi-play" id="play-icon"></span></button>
            <button class="control-btn pause-btn" id="pause-btn" style="display:none;"><span class="mdi mdi-pause"></span></button>
            <button class="control-btn reset-btn" id="reset-btn"><span class="mdi mdi-refresh"></span></button>
          </div>
          <button class="skip-break-btn" id="skip-break-btn" style="display:none;">
            <span class="mdi mdi-information-outline"></span> 记录中断
          </button>
        </div>

        <div class="pomo-right">
          <div class="pomo-panel stats-panel">
            <h3 class="panel-title">今日统计</h3>
            <div class="stats-grid">
              <div class="stat-card"><div class="stat-icon mdi mdi-check-circle" style="color:#10b981"></div><div class="stat-number" id="completed-pomodoros">0</div><div class="stat-label">完成番茄</div></div>
              <div class="stat-card"><div class="stat-icon mdi mdi-clock-outline" style="color:#3b82f6"></div><div class="stat-number" id="focus-time">0分</div><div class="stat-label">专注时长</div></div>
              <div class="stat-card"><div class="stat-icon mdi mdi-chart-line" style="color:#f5a623"></div><div class="stat-number" id="average-focus">0分</div><div class="stat-label">平均专注</div></div>
              <div class="stat-card"><div class="stat-icon mdi mdi-close-circle" style="color:#ef4444"></div><div class="stat-number" id="interruption-count">0</div><div class="stat-label">中断次数</div></div>
            </div>
          </div>
          <div class="pomo-panel achievements-panel">
            <h3 class="panel-title">成就</h3>
            <div class="achievement-grid">
              <div class="achievement-item"><span class="mdi mdi-flash"></span><span>动力之星</span></div>
              <div class="achievement-item"><span class="mdi mdi-target"></span><span>专注达人</span></div>
              <div class="achievement-item"><span class="mdi mdi-rocket-launch"></span><span>效率专家</span></div>
              <div class="achievement-item"><span class="mdi mdi-clock-check"></span><span>坚持不懈</span></div>
              <div class="achievement-item"><span class="mdi mdi-trophy"></span><span>番茄大师</span></div>
              <div class="achievement-item"><span class="mdi mdi-fire"></span><span>连击达人</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="settings-page" id="settings-page">
    <div class="settings-container">
      <div class="settings-header">
        <div class="settings-title">设置</div>
        <button class="close-btn" id="close-settings"><span class="mdi mdi-close"></span></button>
      </div>
      <div class="settings-content">
        <div class="settings-section">
          <div class="settings-section-title">天气城市</div>
          <div class="settings-group">
            <div class="city-settings">
              <div class="city-block">
                <h3>主要城市</h3>
                <p class="city-help">输入示例：beijing chaoyang</p>
                <div class="city-inputs">
                  <input type="text" id="main-city" placeholder="城市（如：beijing）">
                  <input type="text" id="main-district" placeholder="地区（如：chaoyang）">
                  <button class="search-btn" id="search-main-city">搜索</button>
                </div>
              </div>
              <div class="city-block">
                <h3>第二城市</h3>
                <p class="city-help">输入示例：shanghai pudong</p>
                <div class="city-inputs">
                  <input type="text" id="secondary-city" placeholder="城市（如：shanghai）">
                  <input type="text" id="secondary-district" placeholder="地区（如：pudong）">
                  <button class="search-btn" id="search-secondary-city">搜索</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">主题</div>
          <div class="settings-group">
            <div class="theme-options">
              <div class="theme-option">
                <input type="radio" id="theme-dark" name="theme" value="dark" checked>
                <label for="theme-dark" class="theme-label">
                  <div class="theme-preview theme-preview-dark"><div class="theme-bg"></div><div class="theme-card-preview"></div></div>
                  <span>简约春日</span>
                </label>
              </div>
              <div class="theme-option">
                <input type="radio" id="theme-colorful" name="theme" value="colorful">
                <label for="theme-colorful" class="theme-label">
                  <div class="theme-preview theme-preview-colorful"><div class="theme-bg"></div><div class="theme-card-preview"></div></div>
                  <span>缤纷春日</span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/holiday.js"></script>
  <script src="scripts/weather.js"></script>
  <script src="scripts/clock.js"></script>
  <script src="scripts/calendar.js"></script>
  <script src="scripts/pomodoro.js"></script>
  <script src="scripts/navigation.js"></script>
  <script src="scripts/settings.js"></script>
  <script src="scripts/pet.js"></script>
  <script src="scripts/media.js"></script>
  <script src="scripts/tauri-api.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
